spring.application.name=backend

# Perfil ativo por padrão: 'dev' (H2 em modo PostgreSQL, sem dependência de serviços externos)
# Para executar com PostgreSQL real, use: SPRING_PROFILES_ACTIVE=prod ou -Dspring-boot.run.profiles=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Configurações globais do servidor
server.port=8080

# Credenciais RBAC padrão para dev/testes, sobreponíveis via variáveis de ambiente [SEC-CRED]
security.secretaria.username=${SECURITY_SECRETARIA_USERNAME:secretaria}
security.secretaria.password=${SECURITY_SECRETARIA_PASSWORD:secretaria123}
security.auditor.username=${SECURITY_AUDITOR_USERNAME:auditor}
security.auditor.password=${SECURITY_AUDITOR_PASSWORD:auditor123}
