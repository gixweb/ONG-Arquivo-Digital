spring.application.name=backend

# Perfil ativo por padrão: 'dev' (H2 em modo PostgreSQL, sem dependência de serviços externos)
# Para executar com PostgreSQL real, use: SPRING_PROFILES_ACTIVE=prod ou -Dspring-boot.run.profiles=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Configurações globais do servidor
server.port=8080
