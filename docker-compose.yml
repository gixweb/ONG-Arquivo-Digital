services:
  postgres:
    image: postgres:16-alpine
    container_name: ong_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ong_arquivo_digital}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
